name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: بررسی تایپ، آزمون و ساخت
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: بررسی تایپ
        run: npx tsc --noEmit
      - name: آزمون لایه دامنه و رندر مسیرها
        run: npm run test
      - name: ساخت تولیدی
        run: npm run build
