[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# مسیریابی از نوع HashRouter است و به بازنویسی مسیر نیاز ندارد؛
# این قاعده فقط برای اطمینان در صورت مهاجرت آینده به BrowserRouter است.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
